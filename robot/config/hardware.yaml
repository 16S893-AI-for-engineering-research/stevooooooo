# Inchworm print-crawl robot: declarative hardware description.
#
# Data, not code. Later tasks (calibration, servo maps) write results back
# here without touching logic. Loaded and validated by inchworm.config; unknown
# or missing fields are rejected. Hardware facts come from doc-1; device
# identities were observed during AA-37 on 2026-10-24.
#
# Units: millimeters and degrees. Every dimensional field carries its unit as a
# name suffix (_mm, _deg, _mm_per_px). See robot/README.md.
#
# Device identity rules:
#   - Key on vendor_id:product_id + usb_serial wherever the device reports a
#     USB serial (identify_by: usb_serial).
#   - Devices with no USB serial (relay, right-arm camera) can only be told
#     apart by where they are plugged in (identify_by: port_path).
#   - windows_busid_observed is informational only: usbipd BusIds are NOT
#     stable across reconnects and must never be used as an identity key.

schema_version: 1

# Driver backend: "mock" (no hardware touched) or "hardware".
# Overridden at runtime by the INCHWORM_BACKEND environment variable.
backend: mock

geometry:
  # Attachment-point pitch along the tube axis, center to center (doc-1 s2).
  attachment_pitch_mm: 183.676

usb:
  # Single USB 2.0 uplink shared by every device: only one camera may stream
  # at a time (doc-1 s6). Hard system invariant, enforced by the AA-6 arbiter.
  max_concurrent_camera_streams: 1

arms:
  left:
    adapter_chip: CH343
    # Owner-reported in AA-37; not yet verified by commanding motion.
    role_verification: owner_reported
    identity:
      vendor_id: "1a86"
      product_id: "55d3"
      usb_serial: "5B91045044"
      identify_by: usb_serial
      linux_by_id: usb-1a86_USB_Single_Serial_5B91045044-if00
      windows_busid_observed: "10-4"
    # Joint-to-servo-ID map for the SO-101 left arm.
    # Populated by a live bus scan (AA-8 scan_servos.py --live).
    # All null until the owner runs the scan and assigns joint names.
    servo_joints:
      shoulder_pan: null
      shoulder_lift: null
      elbow_flex: null
      wrist_flex: null
      wrist_roll: null
      gripper: null
  right:
    adapter_chip: CH343
    role_verification: owner_reported
    identity:
      vendor_id: "1a86"
      product_id: "55d3"
      usb_serial: "5B91030298"
      identify_by: usb_serial
      linux_by_id: usb-1a86_USB_Single_Serial_5B91030298-if00
      windows_busid_observed: "9-3"
    # Joint-to-servo-ID map for the SO-101 right arm.
    # Populated by a live bus scan (AA-8 scan_servos.py --live).
    # All null until the owner runs the scan and assigns joint names.
    servo_joints:
      shoulder_pan: null
      shoulder_lift: null
      elbow_flex: null
      wrist_flex: null
      wrist_roll: null
      gripper: null

dexarm:
  identity:
    vendor_id: "0483"
    product_id: "5740"
    usb_serial: "306133643438"
    identify_by: usb_serial
    linux_by_id: usb-STMicroelectronics_STM32F407ZG_CDC_in_FS_Mode_306133643438-if00
    windows_busid_observed: "11-3"
  # --- AA-12: DexArm workspace bounds (mm, arm frame). Values from Rotrics
  # DexArm spec; all motions outside this box are rejected before transmission.
  # Owner: verify / tighten after first live session.
  workspace:
    x_min_mm: -300.0
    x_max_mm:  300.0
    y_min_mm:    0.0
    y_max_mm:  450.0
    z_min_mm: -100.0
    z_max_mm:  400.0
    # unverified: true — bounds are a placeholder from the Rotrics spec and
    # have NOT been measured against the as-built chassis envelope.  The
    # hardware session must measure the real envelope and replace these values,
    # then set unverified to false.
    unverified: true
  # --- AA-12 end ---

cameras:
  left_arm:
    # doc-1 s4 specifies a Waveshare OV9281; the device enumerates as
    # "openaicam" 32e6:9251. Recorded as an observation, not a model claim.
    #
    # CORRECTION (AA-5, 2026-10-24): BOTH openaicam 32e6:9251 cameras report
    # USB serial 5423534724 to Linux (/sys/bus/usb/devices/1-5 and 1-6 both
    # have serial=5423534724). udev cannot distinguish them; /dev/v4l/by-id
    # is ambiguous. The only stable distinguisher is the Windows usbipd BusId,
    # which encodes the physical dock port.
    # Identity: POSITIONAL via windows_busid (dock port 9-4). The dock port
    # must not change; if it does, update windows_busid here.
    # Discovery resolves this via vhci_hcd.0/status -> sysfs -> /dev/videoN.
    spec_model: Waveshare OV9281
    observed_usb_product: openaicam
    identity:
      vendor_id: "32e6"
      product_id: "9251"
      # NOTE: usb_serial is left as observed; it is NOT used for identification
      # (both cameras report the same serial 5423534724).
      usb_serial: null
      identify_by: usbip_busid
      # windows_busid is the identity key: physical dock port 9-4.
      # POSITIONAL: dock port must not change.
      windows_busid: "9-4"
      linux_by_id: null
      linux_by_path: null
      windows_busid_observed: "9-4"
  right_arm:
    spec_model: Waveshare OV9281
    observed_usb_product: openaicam
    identity:
      vendor_id: "32e6"
      product_id: "9251"
      # NOTE: usb_serial is NOT used for identification; both cameras share
      # serial 5423534724 and cannot be told apart by serial, VID:PID, or
      # Linux path. Identity: POSITIONAL via windows_busid (dock port 10-2).
      usb_serial: null
      identify_by: usbip_busid
      # windows_busid is the identity key: physical dock port 10-2.
      # POSITIONAL: dock port must not change.
      windows_busid: "10-2"
      linux_by_id: null
      linux_by_path: null
      windows_busid_observed: "10-2"
  scanner:
    spec_model: Arducam OV9281
    observed_usb_product: Arducam OV9281 USB Camera
    identity:
      vendor_id: "0c45"
      product_id: "6366"
      usb_serial: "UC762"
      identify_by: usb_serial
      linux_by_id: usb-Arducam_Technology_Co.__Ltd._Arducam_OV9281_USB_Camera_UC762-video-index0
      windows_busid_observed: "11-4"

relay:
  # USB serial relay switching laser power. Candidate identity (AA-37):
  # CH340 with no USB serial, identified by VID:PID 1a86:7523 alone.
  # SAFETY: controls laser power. If more than one CH340 1a86:7523 is present,
  # discovery and resolution MUST fail with an explicit error naming 'relay'.
  # linux_by_path is informational only (WSL usbip port at time of AA-37); the
  # udev rule (99-inchworm.rules) matches by VID:PID without any port-path pin.
  adapter_chip: CH340
  identity:
    vendor_id: "1a86"
    product_id: "7523"
    usb_serial: null
    identify_by: vid_pid
    linux_by_id: usb-1a86_USB_Serial-if00-port0
    linux_by_path: platform-vhci_hcd.0-usb-0:4:1.0-port0
    windows_busid_observed: "9-2"

# --- AA-10 ---
homing:
  # Named neutral pose for homing (joint angles in degrees, 0-360 STS3215 range).
  # UNVERIFIED: these are placeholder values. A hardware session is required to
  # confirm safe neutral poses for both arms before running live homing.
  neutral_pose_deg:
    shoulder_pan: 180.0
    shoulder_lift: 180.0
    elbow_flex: 180.0
    wrist_flex: 180.0
    wrist_roll: 180.0
  # Whether AA-9 joint limits have been measured and are present in config.
  # Homing refuses to run live (--live flag required) if this is false.
  joint_limits_verified: false
  # Velocity limit during homing motion (goal_speed register 0x2E / 46).
  # Units: raw ticks/s. Set conservatively until verified.
  # UNVERIFIED: value is a conservative placeholder.
  goal_speed_ticks: 200
  # Acceleration limit during homing motion (acceleration register 0x29 / 41).
  # Units: raw ticks/s^2 (hardware-defined scale). Conservative placeholder.
  # UNVERIFIED.
  acceleration_ticks: 50
  # Torque limit during homing (torque_limit register 0x30 / 48).
  # Units: raw load units (0-1000 range on STS3215). Conservative placeholder.
  # UNVERIFIED.
  torque_limit_raw: 500

fault_thresholds:
  # UNVERIFIED: these thresholds are conservative placeholders.
  # A hardware session is required to confirm safe values before production use.
  # Overcurrent threshold (raw current register, u16 hardware units).
  # STS3215 present_current register 0x45; units are hardware-defined.
  overcurrent_raw: 800
  # Overtemperature threshold (degrees C, present_temperature register 0x3F).
  overtemperature_c: 70
  # Gripper locked band: range of gripper position register values (degrees)
  # that indicate the gripper may be engaged with an attachment point.
  # null means the band is unknown -> fail closed (assume possibly locked).
  gripper_locked_band_deg_low: null
  gripper_locked_band_deg_high: null
# --- AA-10 end ---

laser:
  # Owner design values (doc-1 s5), not calibrated values.
  switched_by: relay
  design:
    laser_to_camera_angle_deg: 40.0
    baseline_offset_mm: 67.0
    standoff_mm: 80.0
    height_sensitivity_mm_per_px: 0.1
  # --- AA-29 ---
  # Maximum continuous laser-on duration in seconds (default 30 s).
  # LaserDriver raises LaserDurationExceededError if a single on-period
  # would exceed this value. Lower this during safety testing.
  max_continuous_on_s: 30.0
  # --- AA-29 end ---

# --- AA-11 ---
# SO-101 5-DoF kinematic chain parameters.
# Source: robot/vendor/so101/so101_new_calib.urdf
#   git-hash a758567c3978dfeefe282ede0500085a48fe8f78
#   TheRobotStudio/SO-ARM100 (2026-10-06)
# Joint origins (xyz, metres) and fixed-frame RPY (rad) are taken verbatim
# from each <joint><origin> tag.  Axis is always [0,0,1] for every revolute
# joint in this URDF.  Joint limits (lower/upper, rad) are taken verbatim from
# <limit> tags.
# NOTE: these are the URDF model values for a stock SO-101.  The owner's
# assembly (CAD/Assembly 1.step) uses a custom gripper and mounting; the
# tool-frame offset and arm base-to-chassis transforms (left_base_T and
# right_base_T below) are marked unverified and must be measured in AA-16.
so101_kinematics:
  # 5-DoF revolute joint chain (proximal → distal).
  # Gripper joint is excluded from IK; it is commanded only via AA-17/AA-8.
  joints:
    - name: shoulder_pan
      parent: base_link
      child: shoulder_link
      # <origin xyz="0.0388353 -8.97657e-09 0.0624" rpy="3.14159 4.18253e-17 -3.14159"/>
      origin_xyz: [0.0388353, 0.0, 0.0624]
      origin_rpy: [3.14159, 0.0, -3.14159]
      axis: [0, 0, 1]
      limit_lower_rad: -1.91986
      limit_upper_rad:  1.91986

    - name: shoulder_lift
      parent: shoulder_link
      child: upper_arm_link
      # <origin xyz="-0.0303992 -0.0182778 -0.0542" rpy="-1.5708 -1.5708 0"/>
      origin_xyz: [-0.0303992, -0.0182778, -0.0542]
      origin_rpy: [-1.5708, -1.5708, 0.0]
      axis: [0, 0, 1]
      limit_lower_rad: -1.74533
      limit_upper_rad:  1.74533

    - name: elbow_flex
      parent: upper_arm_link
      child: lower_arm_link
      # <origin xyz="-0.11257 -0.028 1.73763e-16" rpy="-3.63608e-16 8.74301e-16 1.5708"/>
      origin_xyz: [-0.11257, -0.028, 0.0]
      origin_rpy: [0.0, 0.0, 1.5708]
      axis: [0, 0, 1]
      limit_lower_rad: -1.69
      limit_upper_rad:  1.69

    - name: wrist_flex
      parent: lower_arm_link
      child: wrist_link
      # <origin xyz="-0.1349 0.0052 3.62355e-17" rpy="4.02456e-15 8.67362e-16 -1.5708"/>
      origin_xyz: [-0.1349, 0.0052, 0.0]
      origin_rpy: [0.0, 0.0, -1.5708]
      axis: [0, 0, 1]
      limit_lower_rad: -1.65806
      limit_upper_rad:  1.65806

    - name: wrist_roll
      parent: wrist_link
      child: gripper_link
      # <origin xyz="5.55112e-17 -0.0611 0.0181" rpy="1.5708 0.0486795 3.14159"/>
      origin_xyz: [0.0, -0.0611, 0.0181]
      origin_rpy: [1.5708, 0.0486795, 3.14159]
      axis: [0, 0, 1]
      limit_lower_rad: -2.74385
      limit_upper_rad:  2.84121

  # Tool frame: offset from gripper_link origin to the TCP (tool centre point).
  # UNVERIFIED: owner's custom gripper (CAD/Assembly 1.step) differs from the
  # stock URDF gripper.  Measure in AA-16 hardware session; set unverified: false.
  tool_frame_offset:
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    unverified: true

  # Base-to-chassis transforms: where each arm's base_link sits in the
  # chassis fixed frame.  UNVERIFIED: must be measured in AA-16.
  # Convention: T_chassis_base  (4×4 HTM, stored as xyz + rpy for compactness)
  left_arm_base_to_chassis:
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    unverified: true
  right_arm_base_to_chassis:
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    unverified: true

  # Joint-space trajectory limits (used by inchworm.trajectory).
  # Conservative safe defaults; tighten after hardware testing.
  trajectory:
    max_velocity_rad_per_s: 1.0
    max_acceleration_rad_per_s2: 2.0
# --- AA-11 end ---
