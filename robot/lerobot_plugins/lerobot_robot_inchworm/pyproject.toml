# AA-44: LeRobot 0.6.x plugin for the inchworm robot (follower robot + leader teleoperator).
# Installed editable into robot/lerobot_env; LeRobot imports it through
# register_third_party_plugins() (distribution name prefix "lerobot_robot_").
[project]
name = "lerobot_robot_inchworm"
version = "0.1.0"
description = "LeRobot robot 'inchworm_follower' and teleoperator 'inchworm_leader' for the inchworm SO-101 cell"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_inchworm"]
