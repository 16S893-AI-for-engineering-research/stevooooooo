[project]
name = "inchworm-robot"
version = "0.1.0"
description = "Control software for the inchworm print-crawl robot (two SO-101 arms + Rotrics DexArm)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    # --- AA-14 ---
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    # --- AA-14 end ---
    # --- serial-transport ---
    "pyserial>=3.5",
    # --- serial-transport end ---
    # --- AA-11 ---
    # numpy is used by inchworm.kinematics (FK/IK) and inchworm.trajectory
    # (trapezoidal joint-space planner).  No ROS or heavy deps; numpy only.
    # --- AA-11 end ---
]

# A dependency group (not an optional extra) so a bare `uv run pytest` installs
# pytest without needing `--extra dev`.
[dependency-groups]
dev = [
    "pytest>=7.0",
    # AA-40: the system-model tests and the view_pose.py dry-run smoke test
    # need the `model` extra; include it so a bare `uv run pytest` runs them
    # instead of failing on a partially installed environment.
    "trimesh>=4.0",
    "scipy>=1.10",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inchworm"]

[project.optional-dependencies]
# --- AA-40: system model (heavy; not required for core robot) ---
model = [
    "trimesh>=4.0",
    "scipy>=1.10",
    "networkx>=3.0",
    "matplotlib>=3.7",
]
# --- AA-40 end ---

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "model: tests that require the model optional-extra (trimesh etc.)",
]

[project.scripts]
inchworm-discover = "inchworm.discover:main"
# --- AA-14 ---
inchworm-camera = "inchworm.camera_cli:main"
# --- AA-14 end ---
# --- AA-10 ---
inchworm-estop = "inchworm.estop:_cli_main"
# --- AA-10 end ---

[tool.uv]
package = true
